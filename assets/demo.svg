<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420"
     font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <title>ADN — symbolic regression on Android</title>
  <desc>Animated demo of flash.py discovering Kepler's 3rd law</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:adn="https://github.com/alpha0az1omega-sketch/adn-symbolic-regression#">
      <rdf:Description>
        <adn:title>ADN flash.py animated demo</adn:title>
        <adn:author>alpha0az1omega</adn:author>
        <adn:year>2026</adn:year>
        <adn:license>MIT</adn:license>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <!-- Background -->
  <rect width="720" height="420" fill="#0d1117" rx="8"/>

  <!-- Top bar (like a window) -->
  <rect width="720" height="28" fill="#161b22" rx="8"/>
  <rect y="20" width="720" height="8" fill="#161b22"/>
  <circle cx="16" cy="14" r="5" fill="#ff5f56"/>
  <circle cx="34" cy="14" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="14" r="5" fill="#27c93f"/>
  <text x="360.0" y="18" fill="#8b949e" font-size="11" text-anchor="middle">
    adn-symbolic-regression / flash.py
  </text>

  <!-- Pulsing cursor (always visible) -->
  <rect x="30" y="52" width="8" height="14" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══ FRAME 1 : Title ═══ -->
  <g>
    
        <animate attributeName="opacity" 
            values="0;1;1;0" 
            keyTimes="0;0.000;0.964;1"
            dur="14.0s" 
            repeatCount="indefinite"/>
    <text x="50" y="62" fill="#c9d1d9" font-size="14">$ python flash.py kepler</text>
  </g>

  <!-- ═══ FRAME 2 : Library ═══ -->
  <g>
    
        <animate attributeName="opacity" 
            values="0;1;1;0" 
            keyTimes="0;0.143;0.964;1"
            dur="14.0s" 
            repeatCount="indefinite"/>
    <text x="50" y="96" fill="#58a6ff" font-size="13">[1/4] Building library...</text>
    <text x="50" y="118" fill="#8b949e" font-size="11">  55 candidate forms: a, a^2, a^3, 1/a, sqrt(a),</text>
    <text x="50" y="134" fill="#8b949e" font-size="11">  sin(a), cos(a), exp(-a), log(a), (a)*(a^2), ...</text>
  </g>

  <!-- ═══ FRAME 3 : OMP ═══ -->
  <g>
    
        <animate attributeName="opacity" 
            values="0;1;1;0" 
            keyTimes="0;0.321;0.964;1"
            dur="14.0s" 
            repeatCount="indefinite"/>
    <text x="50" y="168" fill="#58a6ff" font-size="13">[2/4] OMP (k = 1..6)...</text>
    <text x="50" y="190" fill="#8b949e" font-size="11">  k=1  best: (a)*(sqrt(a))    MSE 4.7e-31</text>
    <text x="50" y="206" fill="#8b949e" font-size="11">  k=2  no improvement</text>
    <text x="50" y="222" fill="#8b949e" font-size="11">  k=3  no improvement</text>
  </g>

  <!-- ═══ FRAME 4 : Simplify ═══ -->
  <g>
    
        <animate attributeName="opacity" 
            values="0;1;1;0" 
            keyTimes="0;0.500;0.964;1"
            dur="14.0s" 
            repeatCount="indefinite"/>
    <text x="50" y="256" fill="#58a6ff" font-size="13">[3/4] SymPy simplification...</text>
    <text x="50" y="278" fill="#8b949e" font-size="11">  a * sqrt(a)  ->  a**(3/2)</text>
  </g>

  <!-- ═══ FRAME 5 : Formula ═══ -->
  <g>
    
        <animate attributeName="opacity" 
            values="0;1;1;0" 
            keyTimes="0;0.643;0.964;1"
            dur="14.0s" 
            repeatCount="indefinite"/>
    <text x="50" y="312" fill="#58a6ff" font-size="13">[4/4] Discovery:</text>
    <text x="50" y="344" fill="#3fb950" font-size="22" font-weight="bold">y = a**(3/2)</text>
    <text x="50" y="366" fill="#8b949e" font-size="11">  → Third Law of Kepler, rediscovered</text>
  </g>

  <!-- ═══ FRAME 6 : Metrics ═══ -->
  <g>
    
        <animate attributeName="opacity" 
            values="0;1;1;0" 
            keyTimes="0;0.786;0.964;1"
            dur="14.0s" 
            repeatCount="indefinite"/>
    <rect x="50" y="384" width="220" height="26" fill="#161b22" rx="4"/>
    <text x="60" y="401" fill="#ffd33d" font-size="12">MSE  4.77e-31</text>
    <rect x="280" y="384" width="180" height="26" fill="#161b22" rx="4"/>
    <text x="290" y="401" fill="#ff7b72" font-size="12">Time  11.0 ms</text>
    <rect x="470" y="384" width="200" height="26" fill="#161b22" rx="4"/>
    <text x="480" y="401" fill="#58a6ff" font-size="12">Phone   Android</text>
  </g>

  <!-- Bottom signature -->
  <text x="700" y="18" fill="#8b949e" font-size="10" text-anchor="end">
    alpha0az1omega · MIT
  </text>
</svg>
